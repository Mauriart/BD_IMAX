<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Administración{% endblock %} · IMAX</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header class="cabecera">
        <div class="barra">
            <a class="marca" href="{{ url_for('listar_peliculas') }}">IMAX <span>Administración</span></a>
            <nav aria-label="Navegación principal">
                <a href="{{ url_for('cartelera.ver_cartelera') }}" {% if request.blueprint == 'cartelera' %}aria-current="page"{% endif %}>Cartelera</a>
                <a href="{{ url_for('listar_peliculas') }}" {% if not request.blueprint %}aria-current="page"{% endif %}>Películas</a>
                <a href="{{ url_for('salas.listar_salas') }}" {% if request.blueprint == 'salas' %}aria-current="page"{% endif %}>Salas y asientos</a>
                <a href="{{ url_for('funciones.listar_funciones') }}" {% if request.blueprint == 'funciones' %}aria-current="page"{% endif %}>Funciones</a>
            </nav>
        </div>
    </header>
    <main class="contenedor">{% block content %}{% endblock %}</main>
    <footer class="pie">Gestión de catálogo y distribución de salas</footer>
</body>
</html>
