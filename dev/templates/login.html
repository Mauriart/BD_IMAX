{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="titulo-pagina"><div><p class="etiqueta">ACCESO</p><h1>Iniciar sesión</h1><p class="descripcion">Ingresa con tu cuenta para acceder a las operaciones de tu rol.</p></div></div>
<section class="tarjeta formulario-pelicula">
{% if error %}<p class="alerta" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label for="correo">Correo</label><input id="correo" name="correo" type="email" maxlength="150" autocomplete="username" value="{{ correo }}" required></div>
    <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></div>
    <div class="acciones-formulario"><button type="submit">Entrar</button><a class="boton secundario" href="{{ url_for('cartelera.ver_cartelera') }}">Volver a cartelera</a></div>
</form>
</section>
{% endblock %}
