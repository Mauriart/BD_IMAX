{% extends 'base.html' %}
{% block title %}{{ error.code }}{% endblock %}
{% block content %}
<section class="tarjeta panel-alta"><h1>{{ 'Acceso no permitido' if error.code == 403 else 'No se pudo completar la solicitud' }}</h1><p class="alerta" role="alert">{{ error.description }}</p><a class="boton secundario" href="{{ url_for('cartelera.ver_cartelera') }}">Volver a cartelera</a></section>
{% endblock %}
